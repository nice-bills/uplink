# Render.com Configuration
# Deploy backend with one click

services:
  - type: web
    name: genesis-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: |
      cd backend && 
      pip install -r requirements.txt
    startCommand: |
      cd backend && 
      uvicorn src.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./genesis.db
      - key: MONAD_RPC_URL
        value: https://testnet-rpc.monad.xyz
      - key: DEBUG
        value: false
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ADMIN_KEY
        generateValue: true
      - key: AGENT_API_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
    healthCheckPath: /health
